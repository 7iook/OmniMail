<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="OmniMail — 简洁、私有的 Cloudflare 域名邮箱。" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('omnimail-theme')
          const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system'
          const theme = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.themePreference = preference
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b0b0c' : '#f5f5f7'
        } catch {}
      })()
    </script>
    <style>
      html, body { margin: 0; background: #f5f5f7; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0b0b0c; }
    </style>
    <title>OmniMail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
